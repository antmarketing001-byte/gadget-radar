<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>大马数码雷达</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: compact sticky console header (logo · view tabs · update time + language) over a dense single column.
   Compare = sticky device header + one spec group per row, every row on the same column grid so values sit under their device;
   prices = sticky budget bar, lane chart, one table per category with one column per RAM/ROM version and a pinned name row;
   device detail switches versions in place and flashes what changed; header has an Excel export (built in the browser). */
:root{
  --bg:#060A12; --grid:rgba(80,190,240,.045); --panel:#0D1422; --panel2:#111A2B; --line:#1C2840; --line2:#2A3B5E;
  --ink:#E7EEF9; --muted:#8C9CB8; --faint:#5A6A86;
  --accent:#3CCBF4; --accent-ink:#03121A; --accent-soft:rgba(60,203,244,.12);
  --win:#3DDC97; --win-soft:rgba(61,220,151,.12); --tag:#FFD23F; --tag-ink:#1D1600; --my:#FF4D6D; --warn:#FFB547;
  --r1:#FFD23F; --r2:#C9D3E1; --r3:#E0A06B; --rk-ink:#171200;
  --d1:#3CCBF4; --d2:#FFB547; --d3:#B794FF; --d4:#FF6B8B;
  --scrim:rgba(2,5,10,.62); --shadow:0 24px 70px -18px rgba(0,0,0,.7);
  --f-disp:"Chakra Petch","Noto Sans SC",system-ui,sans-serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-data:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --hh:96px; color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#EEF3F9; --grid:rgba(2,110,170,.06); --panel:#FFFFFF; --panel2:#F5F8FC; --line:#DAE3EE; --line2:#C3D0E2;
    --ink:#0A1324; --muted:#50617C; --faint:#8494AC;
    --accent:#0284C7; --accent-ink:#FFFFFF; --accent-soft:rgba(2,132,199,.09);
    --win:#04956A; --win-soft:rgba(4,149,106,.10); --tag:#FFD23F; --tag-ink:#1D1600; --my:#E11D48; --warn:#B45309;
    --r1:#F5B800; --r2:#B4C0D0; --r3:#D88A4C; --rk-ink:#171200;
    --d1:#0284C7; --d2:#D97706; --d3:#7C3AED; --d4:#E11D48;
    --scrim:rgba(10,20,36,.38); --shadow:0 24px 60px -20px rgba(10,30,60,.35);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#EEF3F9; --grid:rgba(2,110,170,.06); --panel:#FFFFFF; --panel2:#F5F8FC; --line:#DAE3EE; --line2:#C3D0E2;
  --ink:#0A1324; --muted:#50617C; --faint:#8494AC;
  --accent:#0284C7; --accent-ink:#FFFFFF; --accent-soft:rgba(2,132,199,.09);
  --win:#04956A; --win-soft:rgba(4,149,106,.10); --tag:#FFD23F; --tag-ink:#1D1600; --my:#E11D48; --warn:#B45309;
  --r1:#F5B800; --r2:#B4C0D0; --r3:#D88A4C; --rk-ink:#171200;
  --d1:#0284C7; --d2:#D97706; --d3:#7C3AED; --d4:#E11D48;
  --scrim:rgba(10,20,36,.38); --shadow:0 24px 60px -20px rgba(10,30,60,.35);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--bg);color:var(--ink);font:13px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- header ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:14px;height:54px}
.logo{display:flex;align-items:center;gap:9px;flex:none;text-decoration:none;color:inherit}
.logo svg{width:28px;height:28px}
.radar .rg{fill:none;stroke:var(--line2);stroke-width:1}
.radar .dotp{fill:var(--accent)}
.radar .sweep{transform-origin:16px 16px;animation:spin 4.5s linear infinite}
.radar .sweep path{fill:var(--accent);opacity:.32}
.logo .nm{display:block;font-weight:700;font-size:14.5px;line-height:1.1;letter-spacing:.02em}
.logo .sub{display:block;font:600 8.5px/1 var(--f-data);letter-spacing:.2em;color:var(--faint);margin-top:4px}
.logo .sub b{color:var(--my);font-weight:600}
.tabs{position:relative;display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.tabs button{position:relative;z-index:1;display:flex;align-items:center;gap:6px;height:30px;padding:0 12px;border:0;background:none;color:var(--muted);font-size:12.5px;font-weight:500;border-radius:7px;transition:color .2s;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"] svg{color:var(--accent)}
.tabs .ind{position:absolute;z-index:0;top:3px;bottom:3px;left:0;width:0;border-radius:7px;background:var(--accent-soft);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 40%,transparent);transition:transform .34s cubic-bezier(.2,.8,.2,1),width .34s cubic-bezier(.2,.8,.2,1)}
.tabs .ind::after{content:"";position:absolute;left:22%;right:22%;bottom:-1px;height:2px;border-radius:2px;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.badge{font:600 10px/16px var(--f-data);min-width:16px;padding:0 4px;border-radius:8px;background:var(--accent);color:var(--accent-ink);text-align:center}
.hr-r{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.upd{display:flex;align-items:center;gap:6px;font:500 10px var(--f-data);color:var(--faint);white-space:nowrap}
.upd i{width:6px;height:6px;border-radius:50%;background:var(--win);box-shadow:0 0 8px var(--win);animation:pulse 2.6s ease-in-out infinite}
.hr-b{display:flex;align-items:center;gap:6px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.lang button{height:18px;min-width:26px;padding:0 6px;border:0;background:none;color:var(--faint);font:600 9.5px/18px var(--f-data);letter-spacing:.06em;transition:background .2s,color .2s}
.lang button+button{border-left:1px solid var(--line)}
.lang button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.cats{display:flex;gap:6px;padding-block:0 9px;overflow-x:auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--muted);font-size:12px;transition:color .2s,border-color .2s,background .2s,box-shadow .2s}
.cat:hover{color:var(--ink)}
.cat .n{font:500 10px var(--f-data);color:var(--faint)}
.cat[aria-pressed="true"]{color:var(--ink);border-color:color-mix(in srgb,var(--accent) 55%,var(--line));background:var(--accent-soft);box-shadow:0 0 18px -9px var(--accent)}
.cat[aria-pressed="true"] svg{color:var(--accent)}
.cat[aria-pressed="true"] .n{color:var(--accent)}

main{padding-block:14px 64px}
.view{animation:vin .34s cubic-bezier(.2,.8,.2,1) both}

/* ---------- toolbars & controls ---------- */
.tb{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.ttl{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.ttl svg{color:var(--accent)}
.cnt{font:500 10.5px var(--f-data);color:var(--faint)}
.sp{flex:1}
.field{height:30px;border:1px solid var(--line);background:var(--panel);border-radius:7px;font-size:12px;padding:0 10px;min-width:0}
.field:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.search{position:relative;display:flex}
.search svg{position:absolute;left:9px;top:8px;width:14px;height:14px;color:var(--faint);pointer-events:none}
.search input{padding-left:29px;width:210px;max-width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}
.seg button{height:28px;padding:0 10px;border:0;background:none;color:var(--muted);font-size:11.5px;white-space:nowrap;transition:background .2s,color .2s}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.btn{height:30px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;border-radius:7px;border:1px solid var(--line);background:var(--panel);font-size:12px;font-weight:500;white-space:nowrap;transition:border-color .18s,background .18s,color .18s,transform .12s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{color:var(--accent-ink);filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.act{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));color:var(--accent);background:var(--accent-soft)}
.rk{display:inline-grid;place-items:center;min-width:16px;height:16px;padding:0 4px;margin-left:6px;border-radius:8px;font:700 9.5px/1 var(--f-data);color:var(--rk-ink);vertical-align:1px;flex:none}
.rk.r1{background:var(--r1);box-shadow:0 0 9px color-mix(in srgb,var(--r1) 55%,transparent)}
.rk.r2{background:var(--r2)}
.rk.r3{background:var(--r3)}
.best{display:inline-block;margin-left:6px;padding:0 5px;border-radius:4px;font:700 9px/15px var(--f-body);letter-spacing:.02em;background:var(--win);color:var(--accent-ink);vertical-align:1px;white-space:nowrap;flex:none}

/* ---------- news ---------- */
.ncols{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media (min-width:980px){.ncols.two{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}}
.nhead{display:flex;align-items:center;gap:8px;margin:0 0 8px;font:600 10.5px var(--f-data);letter-spacing:.16em;color:var(--muted)}
.nhead .n{color:var(--faint);font-weight:500;letter-spacing:0}
.nhead::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.flag{font:700 9.5px/16px var(--f-data);padding:0 6px;border-radius:4px;background:var(--my);color:#fff;letter-spacing:.1em}
.flag.intl{background:var(--panel2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.nlist{display:flex;flex-direction:column;gap:6px}
.ni{position:relative;display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;padding:10px 12px 10px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);transition:border-color .2s,transform .2s;animation:rise .4s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 22ms)}
.ni:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));transform:translateX(2px)}
.ni::before{content:"";position:absolute;left:-1px;top:12px;bottom:12px;width:2px;border-radius:2px;background:var(--line2)}
.ni.my::before{background:var(--my);box-shadow:0 0 8px var(--my)}
.nd{font:600 16px/1 var(--f-disp);text-align:center;padding-top:3px;font-variant-numeric:tabular-nums}
.nd small{display:block;font:500 9px var(--f-data);letter-spacing:.1em;color:var(--faint);margin-top:4px}
.nm{display:flex;flex-wrap:wrap;align-items:center;gap:3px 8px;font-size:10.5px;color:var(--faint)}
.kind{font-size:10px;font-weight:600;padding:0 6px;line-height:17px;border-radius:4px;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line);background:var(--panel2)}
.kind.launch{color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent)}
.kind.price,.kind.deal{color:var(--tag-ink);background:var(--tag);box-shadow:none}
.kind.rumor{color:var(--warn);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--warn) 40%,transparent);background:transparent}
.ni h3{margin:3px 0 2px;font-size:13.5px;font-weight:600;line-height:1.45;text-wrap:pretty}
.ni h3 a{color:inherit;text-decoration:none}
.ni h3 a:hover{color:var(--accent)}
.ni h3 .ext{font:500 10px var(--f-data);color:var(--faint);margin-left:4px}
.ni p{margin:0;font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ndev{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chipd{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:5px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);font-size:11px;transition:color .18s,border-color .18s}
.chipd:hover{color:var(--accent);border-color:var(--accent)}
.chipd svg{width:11px;height:11px}

/* ---------- device cards ---------- */
.ghead{display:flex;align-items:center;gap:8px;margin:18px 0 8px;font:600 10.5px var(--f-data);letter-spacing:.16em;color:var(--muted)}
.ghead:first-child{margin-top:0}
.ghead svg{color:var(--accent);width:14px;height:14px}
.ghead .n{color:var(--faint);font-weight:500;letter-spacing:0}
.ghead::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(178px,1fr))}
.card{position:relative;display:flex;flex-direction:column;gap:6px;padding:10px 10px 9px;border:1px solid var(--line);border-radius:10px;background:linear-gradient(180deg,var(--panel2),var(--panel) 70%);cursor:pointer;min-width:0;
  transition:transform .22s cubic-bezier(.2,.8,.2,1),border-color .2s,box-shadow .22s;animation:rise .42s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 16ms)}
.card::before{content:"";position:absolute;left:5px;top:5px;width:7px;height:7px;border-left:1.5px solid var(--accent);border-top:1.5px solid var(--accent);border-top-left-radius:2px;opacity:.6}
.card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 50%,var(--line));box-shadow:0 10px 26px -16px var(--accent)}
.card.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent),0 0 22px -12px var(--accent)}
.cb{padding-left:9px;padding-right:26px;font:500 9.5px/1.2 var(--f-data);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card h3{margin:0;font-size:13.5px;font-weight:600;line-height:1.3;min-height:2.6em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{display:inline-block;background:var(--tag);color:var(--tag-ink);font:600 11.5px/20px var(--f-data);font-variant-numeric:tabular-nums;padding:0 8px 0 13px;clip-path:polygon(7px 0,100% 0,100% 100%,7px 100%,0 50%);white-space:nowrap}
.tag.none{background:var(--panel2);color:var(--faint)}
.pr{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--faint)}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin:0;background:var(--line);border:1px solid var(--line);border-radius:7px;overflow:hidden}
.mini div{background:var(--panel);padding:4px 7px;min-width:0}
.mini dt{font-size:9.5px;color:var(--faint);line-height:1.3}
.mini dd{margin:0;font:500 11.5px/1.35 var(--f-data);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cf{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:10.5px;color:var(--faint)}
.aic{font:600 10px/16px var(--f-data);color:var(--accent);padding:0 5px;border-radius:4px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 40%,transparent);white-space:nowrap}
.aic.zero{color:var(--faint);box-shadow:inset 0 0 0 1px var(--line)}
.fcn{font:600 10px/16px var(--f-data);color:var(--muted);padding:0 5px;border-radius:4px;box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap}
.st{display:inline-flex;align-items:center;gap:4px;color:var(--win);white-space:nowrap}
.st::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;box-shadow:0 0 6px currentColor}
.st.soon{color:var(--warn)}
.st.pre{color:var(--accent)}
.st.imp{color:var(--muted)}
.nw{display:inline-flex;align-items:center;margin-left:5px;padding:0 4px;border-radius:3px;font:700 8.5px/14px var(--f-data);letter-spacing:.08em;color:var(--accent-ink);background:var(--accent);box-shadow:0 0 10px -2px var(--accent);vertical-align:middle}
/* download button under 中 / EN */
.dl{display:inline-flex;align-items:center;gap:3px;height:17px;padding:0 6px;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--faint);font:600 8.5px/15px var(--f-data);letter-spacing:.06em;transition:color .2s,border-color .2s,background .2s}
.dl svg{width:10px;height:10px;stroke-width:2.2}
.dl:hover{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 60%,var(--line))}
.dl.busy{opacity:.55;pointer-events:none}
.dl.busy svg{animation:pulse 1s ease-in-out infinite}
/* product thumbnails (background removed) */
.th{display:grid;place-items:center;flex:none;overflow:hidden}
.th img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(0,0,0,.35))}
.th.ph{color:var(--faint);opacity:.55}
.th.ph svg{width:46%;height:46%}
.th.tc{width:52px;height:58px;border-radius:7px;background:radial-gradient(circle at 50% 60%,color-mix(in srgb,var(--accent) 10%,transparent),transparent 70%)}
.th.td{width:96px;height:104px;border-radius:10px;background:radial-gradient(circle at 50% 60%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 70%)}
.th.tm{width:24px;height:30px}
.th.tk{position:absolute;right:22px;top:8px;width:24px;height:30px}
.dcell{padding-right:50px}
.ch{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;align-items:center}
.ct{min-width:0;display:flex;flex-direction:column;gap:3px}
.ct .cb{padding-left:0}
.ct h3{min-height:0}
.vn{align-self:flex-start;font:600 9px/14px var(--f-data);color:var(--muted);padding:0 4px;border-radius:3px;box-shadow:inset 0 0 0 1px var(--line)}
s.old{font:500 10px var(--f-data);color:var(--faint)}
/* version picker in the detail panel */
.vars{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:12px 0 2px}
.vl{font:600 9.5px var(--f-data);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-right:2px}
.var{display:inline-flex;flex-direction:column;align-items:flex-start;gap:1px;padding:5px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--muted);text-align:left;transition:border-color .2s,background .2s,color .2s,transform .15s}
.var b{font:600 11.5px var(--f-data);color:var(--ink)}
.var span{font:500 10.5px var(--f-data)}
.var s{font:500 9px var(--f-data);color:var(--faint)}
.var:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.var:active{transform:scale(.97)}
.var.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.var.on span{color:var(--accent)}

function enDev(d){return S.lang==="en"&&EN.devices?EN.devices[d.id]:null}

function val(d,k){
  if(k==="price_myr")return d.price_myr==null?null:d.price_myr;

function ntxt(n,f){if(S.lang==="en"&&EN.news&&EN.news[n.id]&&EN.news[n.id][f])return EN.news[n.id][f];return n[f]}
function fmt(v,u){
  if(v==null||v==="")return"—";
  if(v===true)return T("yes");
  if(v===false)return T("no");
  if(typeof v==="number"){
    if(u==="RM")return rm(v);
    if(u==="storage")return v>=1024?(v/1024)+" TB":v+" GB";
    if(u==="×")return v+"×";
    if(u==="score")return v>=1e6?(Math.round(v/1e4)/100)+"M":Math.round(v/1e3)+"K";
    if(u==="″")return v+"″";
    if(u==="d")return v+" "+T("u_d");
    if(u==="y")return v+" "+T("u_y");
    return v.toLocaleString("en-MY")+(u?" "+u:"");
  }
  return String(v);
}

function launchDate(d){const m=/^(\d{4})-(\d{2})(?:-(\d{2}))?$/.exec(String(d.launch_my||""));return m?new Date(+m[1],+m[2]-1,m[3]?+m[3]:15):null}
function isNew(d){if((d.status||"在售")!=="在售")return false;const t=launchDate(d);if(!t)return false;const days=(Date.now()-t.getTime())/864e5;return days>=0&&days<=30}
function status(d){const s=STATUS[d.status||"在售"]||["",d.status];const nw=isNew(d)||(!d._v&&vlist(d).some(v=>v.launch_my&&isNew(vdev(d,v))));return`<span class="st ${s[0]}">${esc(S.lang==="en"?s[1]:(d.status||"在售"))}</span>${nw?`<span class="nw" title="${T("new_title")}">NEW</span>`:""}`}

/* dense ranking: equal values share a place; places 1–3 get a badge; yes/no rows only mark the "yes" side */
function ranks(better,vals){
  if(!better)return null;
  const nums=vals.map(v=>better==="bool"?(v===true?1:v===false?0:null):(typeof v==="number"?v:null));
  const uniq=[...new Set(nums.filter(n=>n!==null))];
  if(uniq.length<2)return null;
  uniq.sort((a,b)=>better==="low"?a-b:b-a);
  return nums.map(n=>{if(n===null)return 0;const r=uniq.indexOf(n)+1;if(better==="bool")return r===1?1:0;return r<=3?r:0});
}

function syncX(e){const t=e.target;if(!t||!t.classList||!t.classList.contains("mxw"))return;const h=t.previousElementSibling;if(h&&h.classList&&h.classList.contains("mxh")&&h.scrollLeft!==t.scrollLeft)h.scrollLeft=t.scrollLeft}

/* ---------- compare ---------- */
function renderCompare(){
  const cat=cmpCat();
  const devs=S.cmp[cat].map(id=>BYID.get(id)).filter(Boolean);
  const o=opts(cat);
  const nOn=SPEC[cat].filter(g=>!o.off.includes(g.g)).length+(o.feat?1:0)+(o.ai?1:0);
  let h=`<div class="tb">
    <div class="ttl">${IC[cat]}${T("cmp_title",cn(cat))}<span class="cnt">${devs.length}/${MAX}</span></div>
    <span class="sp"></span>
    <button class="btn" data-action="picker">${IC.plus}${T("add_model")}</button>
    <button class="btn" data-action="opts">${IC.sliders}${T("options")}<span class="badge">${nOn}</span></button>
    ${devs.length?`<button class="btn ghost" data-action="clear-cmp">${T("clear")}</button>`:""}
  </div>`;
  if(devs.length<2){
    const rest=DEV.filter(d=>d.category===cat&&!S.cmp[cat].includes(d.id));
    h+=`<div class="empty"><h3>${T("pick_more",2-devs.length,cn(cat))}</h3><p>${T("max_per")}</p>
      ${rest.length?`<div class="quick">${rest.slice(0,10).map(d=>`<button class="btn" data-action="toggle-cmp" data-id="${esc(d.id)}">${IC.plus}${esc(dname(d))}</button>`).join("")}</div>`:""}</div>`;
    $("#v-compare").innerHTML=h;return;
  }
  const n=devs.length;
  const firsts=devs.map(()=>0);
  const groups=[];
  for(const g of SPEC[cat]){
    if(o.off.includes(g.g))continue;
    let rows="",cnt=0;
    for(const [k,zh,en,u,better] of g.rows){
      const vals=devs.map(d=>val(d,k));
      const shown=vals.map(v=>fmt(v,u));
      if(shown.every(s=>s==="—"))continue;
      if(o.diff&&shown.every(s=>s===shown[0]))continue;
      const rk=ranks(better,vals);
      if(rk)rk.forEach((r,i)=>{if(r===1)firsts[i]++});
      const dir=better==="high"?"↑":better==="low"?"↓":"";
      rows+=`<div class="row cols"><div class="rl">${rowLab(devs.every(isFold)?devs[0]:null,k,zh,en)}${dir?`<span class="dir">${dir}</span>`:""}</div>${shown.map((s,i)=>{const r=rk?rk[i]:0;return`<div class="rv c${i}${r===1?" k1":""}${s==="—"?" nil":""}">${esc(s)}${r===1?bestB():""}</div>`}).join("")}</div>`;
      cnt++;
    }
    if(cnt)groups.push(`<section class="box" style="--i:${groups.length}"><div class="bh"><span class="k"></span><b>${lab(g)}</b><span class="r">${T("rows",cnt)}</span></div>${rows}</section>`);
  }
  const listBox=(title,key)=>`<section class="box" style="--i:${groups.length}"><div class="bh"><span class="k"></span><b>${title}</b><span class="r">${T("listed")}</span></div>
    <div class="row cols"><div class="rl">${title}</div>${devs.map((d,i)=>{const l=arr(dtxt(d,key));return`<div class="rv c${i}${l.length?"":" nil"}">${l.length?`<ul>${l.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:T("not_listed")}</div>`}).join("")}</div></section>`;
  if(cat==="watch"&&o.health)groups.push(listBox(T("health"),"health"));
  if(o.feat)groups.push(listBox(T("features"),"features"));
  if(o.ai)groups.push(listBox(T("ai"),"ai_features"));
  const bar=`<div class="dbar cols">
    <div class="dlab">${n<MAX?`<button class="btn" data-action="picker">${IC.plus}<span>${T("add_short")}</span></button>`:`<small>${T("models").toUpperCase()}</small>`}</div>
    ${devs.map((d,i)=>`<div class="dcell c${i}">
      ${thumb(d,"tk")}<span class="bb"><span class="dot"></span>${esc(d.brand||"")}</span>
      <b>${esc(d.model||"")}</b>
      <span class="meta"><span>${d.price_myr!=null?esc(rm(d.price_myr)):"—"}</span><span class="lead">${T("leads",firsts[i])}</span></span>
      <button class="rm" data-action="toggle-cmp" data-id="${esc(d.id)}" aria-label="${T("rm_cmp")}">${IC.x}</button>
    </div>`).join("")}
  </div>`;
  h+=legendHTML().replace('class="legend"','class="legend" style="display:flex"');
  h+=`<div class="cmp" data-n="${n}" style="--n:${n}">${bar}${groups.length?`<div class="groups">${groups.join("")}</div>`:`<div class="empty"><p>${T("no_opts")}</p></div>`}</div>`;
  $("#v-compare").innerHTML=h;
}

/* ---------- prices ---------- */
function bounds(){const b=S.budget;return S.under?[0,b]:[Math.max(0,b-S.range),b+S.range]}
function renderPrice(){
  $("#v-price").innerHTML=`<div class="ptb"><div class="tb">
      <div class="ttl">${IC.tag}${T("price_title")}</div>
      <span class="sp"></span>
      <label class="bud-in"><span>${T("budget")} RM</span><input id="budget" type="number" inputmode="numeric" min="0" step="100" value="${S.budget}" aria-label="${T("budget")}"></label>
      <label class="bud-in ${S.under?"off":""}" id="range-wrap"><span>${T("range")} RM</span><input id="range" type="number" inputmode="numeric" min="0" step="100" value="${S.range}" aria-label="${T("range")}" ${S.under?"disabled":""}></label>
      <button class="btn ${S.under?"act":""}" id="under-btn" data-action="under" aria-pressed="${S.under}">${T("under")}</button>
      <button class="btn" id="mem-btn" data-action="mem"></button>
      <button class="btn" id="pbrand-btn" data-action="pbrands"></button>

function syncPriceBar(){
  const ri=document.getElementById("range"),rw=document.getElementById("range-wrap"),ub=document.getElementById("under-btn");
  if(ri)ri.disabled=S.under;
  if(rw)rw.classList.toggle("off",S.under);

  const pb=document.getElementById("pbrand-btn");
  if(pb){const n=S.pbrands.length;pb.className="btn"+(n?" act":"");pb.innerHTML=`${IC.filter}${T("brands")}${n?`<span class="badge">${n}</span>`:""}`}
  const mb=document.getElementById("mem-btn");
  if(mb){const n=S.mem.ram.length+S.mem.rom.length;mb.className="btn"+(n?" act":"");mb.innerHTML=`${IC.sliders}RAM &amp; ROM${n?`<span class="badge">${n}</span>`:""}`}
}
function renderPriceRes(){
  syncPriceBar();
  const [lo,hi]=bounds();
  const cats=S.cat==="all"?CAT_KEYS:[S.cat];
  const inR=d=>typeof d.price_myr==="number"&&d.price_myr>=lo&&d.price_myr<=hi&&memOK(d);
  const pct=v=>Math.max(0,Math.min(100,v/PTOP*100));
  const step=PTOP<=10000?1000:2000;
  const ticks=[];for(let v=0;v<=PTOP;v+=step)ticks.push(v);
  const narrow=window.matchMedia&&matchMedia("(max-width:760px)").matches;
  const maxLv=narrow?4:2,gapPct=narrow?2.8:2.4;
  const lanes=cats.map(c=>{
    const items=PRICED.filter(d=>d.category===c).sort((a,b)=>a.price_myr-b.price_myr);
    const last=Array(maxLv+1).fill(-99);
    const dots=items.map(d=>{const p=pct(d.price_myr);let lv=0;while(lv<maxLv&&p-last[lv]<gapPct)lv++;last[lv]=p;
      return`<button class="pdot c${CAT_KEYS.indexOf(c)} ${inR(d)?"in":""}${S.pbrands.length?(S.pbrands.includes(d.brand)?" hl":" dm"):""}" style="left:${p.toFixed(2)}%;top:${4+lv*9}px" data-action="open" data-id="${esc(d.id)}" data-v="${d._vi!=null?d._vi:""}" title="${esc(dname(d))}${d._v?" "+esc(vlabel(d._v)):""} · ${esc(rm(d.price_myr))}" aria-label="${esc(dname(d))}${d._v?" "+esc(vlabel(d._v)):""} ${esc(rm(d.price_myr))}"></button>`}).join("");
    return{c,dots};
  });
  const lad=`<div class="lad-wrap"><div class="lad">
    <div>${lanes.map(l=>`<div class="ln c${CAT_KEYS.indexOf(l.c)}">${IC[l.c]}<span>${cn(l.c)}</span></div>`).join("")}<div class="ln ax"></div></div>
    <div class="plot">
      <div class="band" style="left:${pct(lo).toFixed(2)}%;width:${(pct(hi)-pct(lo)).toFixed(2)}%"></div>
      <div class="budl" style="left:${pct(S.budget).toFixed(2)}%"><b>${esc(rm(S.budget))}</b></div>
      ${lanes.map(l=>`<div class="track">${l.dots}</div>`).join("")}
      <div class="axis">${ticks.map(v=>`<span style="left:${pct(v).toFixed(2)}%">${v?v/1000+"k":"0"}</span>`).join("")}</div>
    </div></div></div>`;
  const total=cats.reduce((n,c)=>n+PRICED.filter(d=>d.category===c&&inR(d)).length,0);
  const anyRank=cats.some(c=>PRICED.filter(d=>d.category===c&&inR(d)).length>3);
  const sum=`<div class="psum"><span>${T("in_range",total,esc(rm(lo)),esc(rm(hi)))}</span>${legendHTML(anyRank)}</div>`;
  const sections=cats.map(c=>matrixHTML(c,PRICED.filter(d=>d.category===c&&inR(d)))).filter(Boolean);
  $("#price-res").innerHTML=lad+sum+(sections.length?`<div class="pgroups">${sections.join("")}</div>`:`<div class="empty"><p>${T("price_empty")}</p></div>`);
  measure();
}

/* one column per model version (RAM/ROM or size); columns ordered by number of "best" rows. More than 3 columns → top-3 badges, otherwise only the best is marked */
function matrixHTML(c,items){
  if(!items.length)return"";
  const useRank=items.length>3;
  const hl=S.pbrands;
  const groups=[];
  for(const g of SPEC[c]){
    const gr=[];
    for(const r of g.rows){
      if(r[0]==="price_myr")continue;
      const vals=items.map(d=>val(d,r[0]));
      if(vals.every(v=>v==null||v===""))continue;
      gr.push({r,vals,rk:ranks(r[4],vals)});
    }
    if(gr.length)groups.push({g,gr});
  }
  const adv=items.map(()=>0);
  groups.forEach(({gr})=>gr.forEach(({rk})=>{if(rk)rk.forEach((k,i)=>{if(k===1)adv[i]++})}));
  const order=items.map((d,i)=>i).sort((a,b)=>adv[b]-adv[a]||items[a].price_myr-items[b].price_myr);
  const cls=i=>hl.length?(hl.includes(items[i].brand)?" hl":" dim"):"";
  const mark=k=>useRank?badge(k):(k===1?bestB():"");
  const span=items.length;
  const head=order.map(i=>{const d=items[i],on=S.cmp[c].includes(d.id),diff=d.price_myr-S.budget;
    return`<th class="mh${cls(i)}" data-action="open" data-id="${esc(d.id)}" data-v="${d._vi!=null?d._vi:""}">
      <div class="mh-top">${status(d)}<button class="add ${on?"on":""}" data-action="toggle-cmp" data-id="${esc(d.id)}" aria-pressed="${on}" aria-label="${on?T("rm_cmp"):T("add_cmp")}">${on?IC.check:IC.plus}</button></div>
      <div class="mh-b"><small>${esc(d.brand||"")}</small><span class="adv">${T("adv",adv[i])}</span></div><div class="mh-m">${thumb(d,"tm")}<div class="mh-n"><b title="${esc(d.model||"")}">${esc(d.model||"")}</b>${d._v&&vlabel(d._v)?`<span class="mv">${esc(vlabel(d._v))}</span>`:""}</div></div>
      <div class="mh-p">${price(d)}${d._v&&d._v.price_old?`<s class="old">${esc(rm(d._v.price_old))}</s>`:""}<span class="delta ${diff<=0?"lo":"hi"}">${diff<=0?"−":"+"}${esc(rm(Math.abs(diff)))}</span></div>
    </th>`}).join("");
  let body="";
  groups.forEach(({g,gr})=>{
    body+=`<tr class="gr"><th class="lc">${lab(g)}</th><td colspan="${span}"></td></tr>`;
    gr.forEach(({r,vals,rk})=>{
      const dir=r[4]==="high"?"↑":r[4]==="low"?"↓":"";
      body+=`<tr><th class="lc">${rowLab(items.every(isFold)?items[0]:null,r[0],r[1],r[2])}${dir?`<span class="dir">${dir}</span>`:""}</th>${order.map(i=>{const s=fmt(vals[i],r[3]);const k=rk?rk[i]:0;return`<td class="${k===1?"k1":""}${s==="—"?" nil":""}${cls(i)}">${esc(s)}${mark(k)}</td>`}).join("")}</tr>`;
    });
  });
  const listRows=(title,key)=>`<tr class="gr"><th class="lc">${title}</th><td colspan="${span}"></td></tr><tr class="ls"><th class="lc"></th>${order.map(i=>{const l=arr(dtxt(items[i],key));return`<td class="${l.length?"":"nil"}${cls(i)}">${l.length?`<ul>${l.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:T("not_listed")}</td>`}).join("")}</tr>`;
  if(c==="watch")body+=listRows(T("health"),"health");
  body+=listRows(T("features"),"features")+listRows(T("ai"),"ai_features");
  const cols=`<colgroup><col class="lcw">${order.map(()=>"<col>").join("")}</colgroup>`;
  return`<section class="box"><div class="bh">${IC[c]}<b>${cn(c)}</b><span class="r">${T("n_models",span)} · ${useRank?T("rank_note"):T("best_note")}</span></div>
    <div class="mxh"><table class="mx" style="--n:${span}">${cols}<thead><tr><th class="lc"><span class="lc-n">${esc(cn(c))}</span></th>${head}</tr></thead></table></div>
    <div class="mxw"><table class="mx" style="--n:${span}">${cols}<tbody>${body}</tbody></table></div></section>`;
}

const isFold=d=>d&&d.specs&&d.specs.cover_size_in!=null;
function rowLab(d,k,zh,en){const o=isFold(d)&&FOLD_LAB[k];return o?(S.lang==="en"?o[1]:o[0]):(S.lang==="en"?en:zh)}
/* the version picked in the detail panel (cheapest first by default) */
function vIndex(d){const n=vlist(d).length;if(!n)return-1;const i=S.vsel[d.id];return typeof i==="number"&&i>=0&&i<n?i:0}

/* RAM & ROM filter for the price finder: only phones and tablets have memory versions, other categories pass through */
function memOK(x){if(x.category!=="phone"&&x.category!=="tablet")return true;const s=x.specs||{};return(!S.mem.ram.length||S.mem.ram.includes(s.ram_gb))&&(!S.mem.rom.length||S.mem.rom.includes(s.storage_gb))}

/* ---------- Excel export: a real .xlsx written in the browser (stored zip + inline strings), one sheet per category, one row per version ---------- */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function zipBlob(files){
  const enc=new TextEncoder(),parts=[],cen=[];let off=0;
  files.forEach(f=>{
    const nm=enc.encode(f.name),d=enc.encode(f.text),c=crc32(d);
    const lh=new DataView(new ArrayBuffer(30));
    [[0,0x04034b50,4],[4,20,2],[6,0x0800,2],[8,0,2],[10,0,2],[12,0x21,2],[14,c,4],[18,d.length,4],[22,d.length,4],[26,nm.length,2],[28,0,2]].forEach(([o,v,s])=>s===4?lh.setUint32(o,v,true):lh.setUint16(o,v,true));
    parts.push(new Uint8Array(lh.buffer),nm,d);
    const ch=new DataView(new ArrayBuffer(46));
    [[0,0x02014b50,4],[4,20,2],[6,20,2],[8,0x0800,2],[10,0,2],[12,0,2],[14,0x21,2],[16,c,4],[20,d.length,4],[24,d.length,4],[28,nm.length,2],[30,0,2],[32,0,2],[34,0,2],[36,0,2],[38,0,4],[42,off,4]].forEach(([o,v,s])=>s===4?ch.setUint32(o,v,true):ch.setUint16(o,v,true));
    cen.push(new Uint8Array(ch.buffer),nm);
    off+=30+nm.length+d.length;
  });
  const cs=cen.reduce((n,a)=>n+a.length,0),end=new DataView(new ArrayBuffer(22));
  [[0,0x06054b50,4],[8,files.length,2],[10,files.length,2],[12,cs,4],[16,off,4]].forEach(([o,v,s])=>s===4?end.setUint32(o,v,true):end.setUint16(o,v,true));
  return new Blob([...parts,...cen,new Uint8Array(end.buffer)],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
const xesc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,"");
function colName(i){let s="";i++;while(i){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s}
function sheetXML(rows,widths){
  const body=rows.map((row,ri)=>`<row r="${ri+1}">${row.map((v,ci)=>{if(v==null||v==="")return"";const ref=colName(ci)+(ri+1),st=ri===0?' s="1"':"";return typeof v==="number"&&isFinite(v)?`<c r="${ref}"${st}><v>${v}</v></c>`:`<c r="${ref}" t="inlineStr"${st}><is><t xml:space="preserve">${xesc(v)}</t></is></c>`}).join("")}</row>`).join("");
  return`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane xSplit="3" ySplit="1" topLeftCell="D2" activePane="bottomRight" state="frozen"/></sheetView></sheetViews><cols>${widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join("")}</cols><sheetData>${body}</sheetData></worksheet>`;
}
function workbookFiles(sheets){
  const NS="http://schemas.openxmlformats.org";
  return[
    {name:"[Content_Types].xml",text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="${NS}/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}</Types>`},
    {name:"_rels/.rels",text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${NS}/package/2006/relationships"><Relationship Id="rId1" Type="${NS}/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
    {name:"xl/workbook.xml",text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="${NS}/spreadsheetml/2006/main" xmlns:r="${NS}/officeDocument/2006/relationships"><sheets>${sheets.map((s,i)=>`<sheet name="${xesc(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join("")}</sheets></workbook>`},
    {name:"xl/_rels/workbook.xml.rels",text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${NS}/package/2006/relationships">${sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="${NS}/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")}<Relationship Id="rId${sheets.length+1}" Type="${NS}/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},
    {name:"xl/styles.xml",text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="${NS}/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFDCEBFF"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`},
    ...sheets.map((s,i)=>({name:`xl/worksheets/sheet${i+1}.xml`,text:sheetXML(s.rows,s.widths)}))
  ];
}
const UNIT_X={"″":"in","storage":"GB","d":"","y":"","score":"","RM":""};
function xCell(v){if(v===true)return T("yes");if(v===false)return T("no");return v==null?"":v}
function buildSheets(){
  const en=S.lang==="en",sheets=[];
  CAT_KEYS.forEach(c=>{
    const specRows=[];(SPEC[c]||[]).forEach(g=>g.rows.forEach(r=>{if(r[0]!=="price_myr")specRows.push(r)}));
    const lists=[c==="watch"?["health",T("health")]:null,["features",T("features")],["ai_features",T("ai")]].filter(Boolean);
    const head=[T("x_brand"),T("x_model"),T("x_version"),T("x_price"),T("x_list"),T("x_status"),T("my_launch"),T("price_date")]
      .concat(specRows.map(r=>{const u=r[3]in UNIT_X?UNIT_X[r[3]]:r[3];const unit=r[3]==="d"?T("u_d"):r[3]==="y"?T("u_y"):u;return(en?r[2]:r[1])+(unit?` (${unit})`:"")}))
      .concat(lists.map(l=>l[1]),[T("sources")]);
    const rows=[head];
    DEV.filter(d=>d.category===c).forEach(d=>{
      const vs=vlist(d),items=vs.length?vs.map((v,i)=>vdev(d,v,i)):[d];
      items.forEach(x=>{
        const st=(en?(STATUS[d.status||"在售"]||["",d.status])[1]:(d.status||"在售"))+(isNew(d)?" · NEW":"");
        rows.push([d.brand||"",d.model||"",x._v?vlabel(x._v):"",x.price_myr==null?"":x.price_myr,x._v&&x._v.price_old?x._v.price_old:"",st,x.launch_my||"",x._v&&x._v.price_date?x._v.price_date:""]
          .concat(specRows.map(r=>xCell(val(x,r[0]))))
          .concat(lists.map(l=>arr(dtxt(d,l[0])).join("; ")),[arr(d.sources).join(" ")]));
      });
    });
    sheets.push({name:cn(c),rows,widths:[12,26,18,11,11,14,12,12].concat(specRows.map(()=>14),lists.map(()=>60),[50])});
  });
  const nh=[[T("x_date"),T("x_region"),T("x_cat"),T("x_kind"),T("x_title"),T("x_summary"),T("x_source"),"URL"]];
  NEWS.forEach(n=>nh.push([n.date||"",n.region==="MY"?T("r_my"):T("r_intl"),cn(n.category)||"",en?((KIND[n.kind]||[])[1]||n.kind||""):(n.kind||""),ntxt(n,"title")||"",ntxt(n,"summary")||"",n.source||"",n.url||""]));
  sheets.push({name:T("tab_news"),rows:nh,widths:[12,10,10,10,50,80,18,50]});
  return sheets;
}
let DLP=null;
function dlCap(){if(DLP)return DLP;try{if(window.claude&&typeof window.claude.use==="function"){DLP=Promise.resolve(window.claude.use("downloads")).catch(()=>null);return DLP}}catch(e){}return Promise.resolve(null)}
function saveBlob(name,blob){const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},2000)}
let dlBusy=false;
async function exportXlsx(){
  if(dlBusy)return;dlBusy=true;
  const b=document.getElementById("dl-btn");if(b)b.classList.add("busy");
  try{
    const blob=zipBlob(workbookFiles(buildSheets()));
    const now=new Date(),pad=n=>String(n).padStart(2,"0");
    const name=`MY-Gadget-Radar-${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}.xlsx`;
    const dl=await dlCap();
    if(dl&&typeof dl.save==="function"){
      try{await dl.save({filename:name,data:blob});toast(T("dl_ok"))}
      catch(e){const c=e&&e.code;if(c==="declined")return;toast(c==="rate_limited"?T("dl_busy"):T("dl_fail"))}
    }else{saveBlob(name,blob);toast(T("dl_ok"))}
  }catch(e){toast(T("dl_fail"))}
  finally{dlBusy=false;if(b)b.classList.remove("busy")}
}

/* ---------- glue ---------- */
let toastT=null;
function toast(msg){const el=$("#toast");$("#toast-t").textContent=msg;el.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("show"),2000)}
const VIEWS=["news","devices","compare","price"];
function renderView(){
  for(const v of VIEWS){const el=$("#v-"+v);const show=S.view===v;if(el.hidden===show)el.hidden=!show}
  if(S.view==="news")renderNews();else if(S.view==="devices")renderDevices();else if(S.view==="compare")renderCompare();else renderPrice();
}
function render(){renderHeader();renderView()}
function scrollPos(){const se=document.scrollingElement||document.documentElement;return window.scrollY||window.pageYOffset||(se&&se.scrollTop)||(document.body&&document.body.scrollTop)||0}
function onTop(){const b=$("#totop");if(b)b.classList.toggle("show",scrollPos()>240)}
function toTop(){
  try{window.scrollTo({top:0,behavior:"smooth"})}catch(e){if(window.scrollTo)window.scrollTo(0,0)}
  const se=document.scrollingElement;if(se&&se.scrollTop&&se.scrollTo)try{se.scrollTo({top:0,behavior:"smooth"})}catch(e){se.scrollTop=0}
}
function setView(v){
  if(!VIEWS.includes(v))v="news";
  S.view=v;
  if(v==="compare"&&S.cat==="all")S.cat=cmpCat();
  render();
  if(window.scrollTo)try{window.scrollTo({top:0})}catch(e){}
  onTop();
}
function toggleCmp(id){
  const d=BYID.get(id);if(!d)return;
  const l=S.cmp[d.category];const i=l.indexOf(id);
  if(i>=0){l.splice(i,1);toast(T("t_removed",cn(d.category)))}
  else if(l.length>=MAX){toast(T("t_max"));return}
  else{l.push(id);toast(T("t_added",cn(d.category),l.length))}
  savePrefs();
  renderHeader();
  if(S.view==="devices")syncCards();else if(S.view==="compare")renderCompare();else if(S.view==="price")renderPriceRes();
  paintPop();
}
document.addEventListener("click",e=>{
  const el=e.target.closest&&e.target.closest("[data-action]");if(!el)return;
  const a=el.dataset.action;
  switch(a){
    case"view":if(el.dataset.v===S.view)toTop();else location.hash=el.dataset.v;break;
    case"lang":if(el.dataset.l!==S.lang){S.lang=el.dataset.l;savePrefs();applyStatic();render();paintPop()}break;
    case"cat":S.cat=el.dataset.c;savePrefs();render();break;
    case"region":S.region=el.dataset.r;renderNews();break;
    case"open":{const id=el.dataset.id;if(el.dataset.v!=null&&el.dataset.v!=="")S.vsel[id]=+el.dataset.v;else delete S.vsel[id];openPop("device",id);break}
    case"variant":{const d=BYID.get(el.dataset.id);if(!d)break;const ni=+el.dataset.i;if(ni===vIndex(d))break;const a=curDev(d);S.vsel[d.id]=ni;const b=curDev(d);const keys=[];if(a.price_myr!==b.price_myr)keys.push("price_myr");if(a.launch_my!==b.launch_my)keys.push("launch_my");(SPEC[d.category]||[]).forEach(g=>g.rows.forEach(r=>{if(fmt(val(a,r[0]),r[3])!==fmt(val(b,r[0]),r[3]))keys.push(r[0])}));S.flash={id:d.id,keys};repaintDevice();S.flash=null;break}
    case"xlsx":exportXlsx();break;
    case"close":closePop();break;
    case"top":toTop();break;
    case"toggle-cmp":toggleCmp(el.dataset.id);break;
    case"clear-cmp":S.cmp[cmpCat()]=[];savePrefs();render();break;
    case"go-cmp":S.cat=el.dataset.c;savePrefs();closePop();if(location.hash==="#compare")setView("compare");else location.hash="compare";break;
    case"picker":S.pq="";openPop("picker");break;
    case"opts":openPop("opts");break;
    case"brands":openPop("brands");break;
    case"brand":{const b=el.dataset.b,i=S.brands.indexOf(b);if(i>=0)S.brands.splice(i,1);else S.brands.push(b);savePrefs();paintPop();renderDevices();break}
    case"brand-clear":S.brands=[];savePrefs();paintPop();renderDevices();break;
    case"opt-group":{const c=cmpCat(),o=opts(c),off=new Set(o.off);if(off.has(el.dataset.g))off.delete(el.dataset.g);else off.add(el.dataset.g);setOpts(c,{off:[...off]});paintPop();renderCompare();break}
    case"opt-feat":{const c=cmpCat();setOpts(c,{feat:!opts(c).feat});paintPop();renderCompare();break}
    case"opt-ai":{const c=cmpCat();setOpts(c,{ai:!opts(c).ai});paintPop();renderCompare();break}
    case"opt-health":{const c=cmpCat();setOpts(c,{health:!opts(c).health});paintPop();renderCompare();break}
    case"opt-diff":{const c=cmpCat();setOpts(c,{diff:!opts(c).diff});paintPop();renderCompare();break}
    case"opt-all":{const c=cmpCat();setOpts(c,{off:[],feat:true,ai:true,health:true,diff:false});paintPop();renderCompare();break}
    case"preset":{S.budget=Number(el.dataset.v);savePrefs();const bi=document.getElementById("budget");if(bi)bi.value=String(S.budget);renderPriceRes();break}
    case"under":S.under=!S.under;savePrefs();renderPriceRes();break;
    case"pbrands":openPop("pbrands");break;
    case"mem":openPop("mem");break;
    case"mem-ram":case"mem-rom":{const k=el.dataset.action==="mem-ram"?"ram":"rom",v=Number(el.dataset.v),i=S.mem[k].indexOf(v);if(i>=0)S.mem[k].splice(i,1);else S.mem[k].push(v);savePrefs();paintPop();renderPriceRes();break}
    case"mem-clear":S.mem={ram:[],rom:[]};savePrefs();paintPop();renderPriceRes();break;
    case"pbrand":{const b=el.dataset.b,i=S.pbrands.indexOf(b);if(i>=0)S.pbrands.splice(i,1);else S.pbrands.push(b);savePrefs();paintPop();renderPriceRes();break}
    case"pbrand-clear":S.pbrands=[];savePrefs();paintPop();renderPriceRes();break;
  }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="q"){S.q=t.value;renderDevices()}

document.addEventListener("scroll",syncX,{passive:true,capture:true});

document.addEventListener("touchstart",headTouchStart,{passive:true});

loadPrefs();
dlCap();
