/* Layout: compact sticky console header (logo · view tabs · update time + language) over a dense single column.

  --r1:#FFD23F; --r2:#C9D3E1; --r3:#E0A06B; --rk-ink:#171200;
  --d1:#3CCBF4; --d2:#FFB547; --d3:#B794FF; --d4:#FF6B8B;

/* ---------- 2026-11-20 refresh (comes after the phone block on purpose: it overrides earlier rules) ---------- */
/* cards: the chip gets its own full row and long values wrap instead of being cut; an odd last spec spans the row as one line;
   price is one line under the name, promo + regular price one line under it; specs and footer sit at the bottom so cards in a row line up */
.mini div{padding:4px 6px}
.mini dd{white-space:normal;overflow-wrap:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mini .w{grid-column:1/-1}

.mini .w.l{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.mini .w.l dd{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
/* chip row: always one line; the size is worked out from the cell width and the name's length (never above the normal size, never below 8.5px) */
.mini{--cfs:11.5px}
.pc .mini{--cfs:10.5px}
.mini .w.c{container-type:inline-size}
.mini .w.c dd{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:var(--cfs);font-size:min(var(--cfs),max(8.5px,calc(100cqw / (var(--n,20) * .62))))}

.promo{max-width:100%;min-width:0;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}

.card h3{overflow-wrap:break-word}

.cmp{--cw:150px}

.shu{width:100%;height:28px;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--muted);font:500 11px var(--f-data);outline:none;text-overflow:ellipsis}
.shu:focus{border-color:var(--accent);color:var(--ink)}
.shg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.sho{display:flex;flex-direction:column;align-items:center;gap:7px;padding:11px 2px 9px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--ink);font:500 11.5px var(--f-body);text-decoration:none;cursor:pointer;transition:border-color .18s,background .18s}
.sho:hover{border-color:var(--line2);color:var(--ink)}
.sho>span{white-space:nowrap}
.sho i{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;color:#fff;font-style:normal}
.sho i svg{width:20px;height:20px}
.sho.wa i{background:#25D366}.sho.tgm i{background:#2AABEE}.sho.fb i{background:#1877F2}
.sho.cp i{background:var(--accent-soft);color:var(--accent)}
.sho.nat{grid-column:1/-1;flex-direction:row;justify-content:center;gap:8px;padding:0;height:42px;background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:600}
.sho.nat:hover{color:var(--accent-ink);filter:brightness(1.08)}
.sho.nat svg{width:17px;height:17px}
.shim{width:100%;height:40px;justify-content:center;margin-top:14px;font-size:13px}
.shn{margin:8px 0 0;color:var(--faint);font-size:11px;line-height:1.55;text-align:center}
.shn.warn{margin:0 0 10px;color:var(--warn);text-align:left}
.shm{display:flex;width:100%;margin-bottom:10px}
.shm button{flex:1;height:32px;font-size:12px}
.shi{display:grid;place-items:center;min-height:260px;border:1px solid var(--line);border-radius:10px;background:#060A12;overflow:hidden}
.shi img{display:block;width:100%;height:auto;-webkit-touch-callout:default}
.shl{display:flex;align-items:center;gap:8px;color:#8C9CB8;font-size:12px}
.shl i{width:14px;height:14px;border-radius:50%;border:2px solid rgba(60,203,244,.25);border-top-color:#3CCBF4;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pf .btn[disabled]{opacity:.45;pointer-events:none}
@media (max-width:760px){
  .sh{align-items:flex-end;padding:0}
  .shp,.shp.wide{width:100%;max-height:90vh;border-radius:16px 16px 0 0;border-bottom:0;transform:translateY(100%)}
  .sh.show .shp{transform:none}
}
@media (max-width:360px){.shg{gap:6px}.sho{font-size:10.5px}.sho i{width:32px;height:32px}}
@media (prefers-reduced-motion:reduce){

const oscope=()=>S.oscope==="price"?"price":"cmp";
const ocat=()=>oscope()==="price"?(CAT_KEYS.includes(S.ocat)?S.ocat:"phone"):cmpCat();
function optCatDefault(){if(S.cat!=="all")return S.cat;return CAT_KEYS.find(k=>PRICED.some(d=>d.category===k&&inPrice(d)))||"phone"}
function oitems(cat,sc){return sc==="price"?PRICED.filter(d=>d.category===cat&&inPrice(d)):S.cmp[cat].map(id=>BYID.get(id)).filter(Boolean)}
function cardRows(cat){const o=opts(cat,"price");if(!o.card)return HEAD[cat]||[];const set=new Set(o.card),out=[];for(const g of SPEC[cat]||[])for(const r of g.rows)if(set.has(r[0])){const o=CLAB[r[0]];out.push([r[0],o?o[0]:r[1],o?o[1]:r[2]])}return out}
function cmpCat(){return S.cat==="all"?(CAT_KEYS.find(k=>S.cmp[k].length)||"phone"):S.cat}
function rowOf(cat,k){for(const g of SPEC[cat]||[])for(const r of g.rows)if(r[0]===k)return r;return null}
/* dense ranking: equal values share a place; places 1–3 get a badge; yes/no rows only mark the "yes" side */
function ranks(better,vals){
  if(!better)return null;
  const nums=vals.map(v=>better==="bool"?(v===true?1:v===false?0:null):(typeof v==="number"?v:null));
  const uniq=[...new Set(nums.filter(n=>n!==null))];
  if(uniq.length<2)return null;
  uniq.sort((a,b)=>better==="low"?a-b:b-a);
  return nums.map(n=>{if(n===null)return 0;const r=uniq.indexOf(n)+1;if(better==="bool")return r===1?1:0;return r<=3?r:0});
}
const badge=r=>r?`<i class="rk r${r}">${r}</i>`:"";
const bestB=()=>`<i class="best">${T("best")}</i>`;

function syncX(e){const t=e.target;if(!t||!t.classList)return;if(t.dataset&&t.dataset.xs){xsSync(t);return}if(!t.classList.contains("mxw"))return;const h=t.previousElementSibling;if(h&&h.classList&&h.classList.contains("mxh")&&h.scrollLeft!==t.scrollLeft)h.scrollLeft=t.scrollLeft}

function headWheel(e){xsGrab(e.target);const h=e.target&&e.target.closest&&(e.target.closest(".mxh")||e.target.closest(".xh"));if(!h)return;const w=headBody(h);const dx=e.deltaX||(e.shiftKey?e.deltaY:0);if(w&&dx){w.scrollLeft+=dx;e.preventDefault()}}
let hdrTouch=null;
function headTouchStart(e){xsGrab(e.target);const h=e.target&&e.target.closest&&(e.target.closest(".mxh")||e.target.closest(".xh"));const w=h?headBody(h):null;hdrTouch=w&&e.touches&&e.touches.length===1?{w,x:e.touches[0].clientX,y:e.touches[0].clientY,l:w.scrollLeft,ax:null}:null}
function headTouchMove(e){if(drag&&drag.on)return;if(!hdrTouch||!e.touches||!e.touches.length)return;const dx=e.touches[0].clientX-hdrTouch.x,dy=e.touches[0].clientY-hdrTouch.y;if(hdrTouch.ax===null&&(Math.abs(dx)>6||Math.abs(dy)>6))hdrTouch.ax=Math.abs(dx)>Math.abs(dy)?"x":"y";if(hdrTouch.ax==="x")hdrTouch.w.scrollLeft=hdrTouch.l-dx}

/* related-model chips stay on one line: chips that do not fit are folded into a "+N" chip (the story pop-up lists them all) */
function fitChips(){
  $$("#v-news .ndev").forEach(row=>{
    const chips=Array.from(row.querySelectorAll("button.chipd")),more=row.querySelector(".chipd.xn");
    chips.forEach(c=>{c.hidden=false});if(more)more.hidden=true;
    row.classList.add("fit");
    if(!row.clientWidth||row.scrollWidth<=row.clientWidth+1||!more)return;
    for(let k=chips.length-1;k>=1;k--){
      chips[k].hidden=true;more.hidden=false;more.textContent="+"+(chips.length-k);
      if(row.scrollWidth<=row.clientWidth+1)break;
    }
    /* only when a single chip is left and still too long does its name get shortened */
    if(row.scrollWidth>row.clientWidth+1)row.classList.remove("fit");
  });
}

/* chip name for a card: no vendor prefix, no core-speed brackets, and in Chinese the official Chinese series names (骁龙 / 天玑 / 麒麟);
   the detail panel keeps the full name */
function shortChip(s){
  let v=String(s).replace(/\s*[（(].*$/,"").replace(/^(Qualcomm|MediaTek|Mediatek|HiSilicon|Samsung|Google|Apple|UNISOC|Unisoc)\s+/i,"").replace(/\s+Wearable Platform$/i,"").trim();
  if(S.lang==="en")return v.replace(/[\s-]+leading version$/i," Leading")||String(s);
  return v.replace(/^Snapdragon\s*/i,"骁龙 ").replace(/^Dimensity\s*/i,"天玑 ").replace(/^Kirin\s*/i,"麒麟 ").replace(/[\s-]+leading version$/i," 领先版")||String(s);
}
/* width of a text in monospace cells (Chinese characters are about 1.67 times as wide) */
const cellLen=s=>Array.from(String(s)).reduce((n,ch)=>n+(/[⺀-鿿＀-￯]/.test(ch)?1.67:1),0);
/* spec box on cards: the chip takes a full row on one line (its text shrinks a little when the name is long), the rest go two per row */
function miniHTML(cat,rows,d){
  const cells=rows.map(([k,zh,en])=>{const r=rowOf(cat,k);let v=fmtc(val(d,k),r?r[3]:"");if(k==="chipset"&&v!=="—")v=shortChip(v);return{k,l:S.lang==="en"?en:zh,v}});
  const one=(c,cls)=>`<div${cls?` class="${cls}"`:""}><dt>${esc(c.l)}</dt><dd title="${esc(c.v)}"${cls==="w c"?` style="--n:${Math.max(1,cellLen(c.v)).toFixed(1)}"`:""}>${esc(c.v)}</dd></div>`;
  const wide=cells.filter(c=>c.k==="chipset"),rest=cells.filter(c=>c.k!=="chipset");
  return wide.map(c=>one(c,"w c")).join("")+rest.map((c,i)=>one(c,rest.length%2&&i===rest.length-1?"w l":"")).join("");
}
function card(d,i){

function sorted(list){
  const l=list.slice();
  if(S.sort==="price-asc")l.sort((a,b)=>(a.price_myr==null?1e12:a.price_myr)-(b.price_myr==null?1e12:b.price_myr));
  else if(S.sort==="price-desc")l.sort((a,b)=>(b.price_myr==null?-1:b.price_myr)-(a.price_myr==null?-1:a.price_myr));
  else if(S.sort==="ai")l.sort((a,b)=>arr(b.ai_features).length-arr(a.ai_features).length);
  else l.sort((a,b)=>String(b.launch_my||"").localeCompare(String(a.launch_my||"")));
  return l;
}
function renderBrandBtn(){
  const n=S.brands.length,b=$("#brand-btn");
  b.className="btn"+(n?" act":"");
  b.innerHTML=`${IC.filter}${T("brands")}${n?`<span class="badge">${n}</span>`:""}`;

function renderDevices(){
  renderBrandBtn();
  const q=S.q.trim().toLowerCase();
  const list=DEV.filter(d=>(S.cat==="all"||d.category===S.cat)&&(!S.brands.length||S.brands.includes(d.brand))&&(!q||dname(d).toLowerCase().includes(q)));
  $("#dev-count").textContent=T("n_models",list.length);
  const body=$("#dev-body");
  if(!list.length){devJob++;const f=q||S.brands.length;body.innerHTML=`<div class="empty"><h3>${f?T("empty_q"):T("empty_cat")}</h3><p>${f?T("empty_q_hint"):T("empty_cat_hint")}</p></div>`;return}
  const cats=S.cat==="all"?CAT_KEYS:[S.cat];
  /* the first screenful is drawn at once and the rest is added in small batches, so switching here never leaves a blank page */
  const job=++devJob,FIRST=30,STEP=60,queue=[];
  let i=0,html="";
  for(const c of cats){
    const items=sorted(list.filter(d=>d.category===c));
    if(!items.length)continue;
    const now=items.slice(0,Math.max(0,FIRST-i));
    html+=`${S.cat==="all"?`<h2 class="ghead">${IC[c]}${cn(c)}<span class="n">${items.length}</span></h2>`:""}<div class="grid" data-g="${c}">${now.map(d=>card(d,i++)).join("")}</div>`;
    if(items.length>now.length)queue.push({c,items:items.slice(now.length)});
  }
  body.innerHTML=html+(queue.length?`<div class="ldm" id="dev-more"><i></i>${T("loading")}</div>`:"");
  const pump=()=>{
    if(job!==devJob)return;
    let n=STEP;
    while(n>0&&queue.length){
      const q=queue[0],take=q.items.splice(0,n);n-=take.length;
      const g=body.querySelector(`.grid[data-g="${q.c}"]`);
      if(g)g.insertAdjacentHTML("beforeend",take.map(d=>card(d,0)).join(""));
      if(!q.items.length)queue.shift();
    }
    if(queue.length)setTimeout(pump,30);else{const m=document.getElementById("dev-more");if(m)m.remove()}
  };
  if(queue.length)setTimeout(pump,30);
}

/* ---------- compare ---------- */
function renderCompare(){
  const cat=cmpCat();
  const devs=S.cmp[cat].map(id=>BYID.get(id)).filter(Boolean);
  const o=opts(cat);
  const nOn=popGroups(cat,"cmp").filter(g=>gstate(o,g)!=="off").length+(o.feat?1:0)+(o.ai?1:0);
  let h=`<div class="tb">
    <div class="ttl">${IC[cat]}${T("cmp_title",cn(cat))}<span class="cnt">${devs.length}/${MAX}</span></div>
    <span class="sp"></span>
    <button class="btn" data-action="picker">${IC.plus}${T("add_model")}</button>
    <button class="btn" data-action="opts">${IC.sliders}${T("options")}<span class="badge">${nOn}</span></button>
    ${devs.length>=2?`<button class="btn${o.diff?" act":""}" data-action="cmp-diff" aria-pressed="${o.diff}">${IC.neq}${T("diff_only")}</button>`:""}
    ${devs.length>=2?`<button class="btn" data-action="share" data-k="c">${IC.share}${T("share")}</button><button class="btn" data-action="longimg" data-k="c">${IC.image}${T("long_img")}</button>`:""}
    ${devs.length?`<button class="btn ghost" data-action="clear-cmp">${T("clear")}</button>`:""}
  </div>`;
  if(devs.length<2){
    const rest=DEV.filter(d=>d.category===cat&&!S.cmp[cat].includes(d.id));
    h+=`<div class="empty"><h3>${T("pick_more",2-devs.length,cn(cat))}</h3><p>${T("max_per")}</p>
      ${rest.length?`<div class="quick">${rest.slice(0,10).map(d=>`<button class="btn" data-action="toggle-cmp" data-id="${esc(d.id)}">${IC.plus}${esc(dname(d))}</button>`).join("")}</div>`:""}</div>`;
    $("#v-compare").innerHTML=h;return;
  }
  const n=devs.length;
  const firsts=devs.map(()=>0);
  const groups=[];
  for(const g of SPEC[cat]){
    if(o.off.includes(g.g)||g.g==="price")continue;
    let rows="",cnt=0;
    for(const [k,zh,en,u,better] of g.rows){
      if(o.hide.includes(k))continue;
      const vals=devs.map(d=>val(d,k));
      const shown=vals.map(v=>fmt(v,u));
      if(shown.every(s=>s==="—"))continue;
      if(o.diff&&shown.every(s=>s===shown[0]))continue;
      const rk=ranks(better,vals);
      if(rk)rk.forEach((r,i)=>{if(r===1)firsts[i]++});
      const dir=better==="high"?"↑":better==="low"?"↓":"";
      rows+=`<div class="row cols"><div class="rl">${rowLab(devs.every(isFold)?devs[0]:null,k,zh,en)}${dir?`<span class="dir">${dir}</span>`:""}</div>${shown.map((s,i)=>{const r=rk?rk[i]:0;return`<div class="rv c${i}${r===1&&o.marks?" k1":""}${s==="—"?" nil":""}">${esc(s)}${r===1&&o.marks?bestB():""}</div>`}).join("")}</div>`;
      cnt++;
    }
    if(cnt)groups.push(`<section class="box" style="--i:${groups.length}"><div class="bh"><span class="k"></span><b>${lab(g)}</b><span class="r">${T("rows",cnt)}</span></div><div class="xs" data-xs="cmp">${rows}</div></section>`);
  }

  const prev=document.querySelector('#v-compare [data-xs="cmp"]:not(.xh)'),x=prev?prev.scrollLeft:0;
  h+=`<div class="cmp" data-n="${n}" style="--n:${n}">${bar}${groups.length?`<div class="groups">${groups.join("")}</div>`:`<div class="empty"><p>${T("no_opts")}</p></div>`}</div>`;

/* ---------- compare: sideways scrolling kept in step, and press-and-hold to reorder ---------- */
let xsLead=null;
function xsSync(t){
  if(!t||!t.dataset||!t.dataset.xs)return false;
  if(xsLead&&xsLead!==t&&document.contains(xsLead))return true;
  const x=t.scrollLeft;
  $$(`[data-xs="${t.dataset.xs}"]`).forEach(el=>{if(el!==t&&Math.abs(el.scrollLeft-x)>.5)el.scrollLeft=x});
  return true;
}
const xsBody=()=>document.querySelector('#v-compare .groups [data-xs="cmp"]');
let drag=null;
function dragStart(e){
  const cell=e.target&&e.target.closest&&e.target.closest(".dcell");
  if(!cell||S.view!=="compare"||e.target.closest(".rm")||(e.pointerType==="mouse"&&e.button!==0))return;
  drag={cell,id:cell.dataset.id,from:+cell.dataset.di,pid:e.pointerId,type:e.pointerType,x0:e.clientX,y0:e.clientY,x:e.clientX,on:false,timer:null,raf:0};
  if(e.pointerType!=="mouse")drag.timer=setTimeout(dragOn,320);
}
function dragOn(){
  if(!drag||drag.on)return;
  const cells=$$("#v-compare .dcell");
  if(cells.length<2){drag=null;return}
  const sc=document.querySelector("#v-compare .xh");
  drag.on=true;drag.cells=cells;drag.sc=sc;drag.sl0=sc?sc.scrollLeft:0;
  drag.mid=cells.map(c=>{const r=c.getBoundingClientRect();return r.left+r.width/2});
  drag.step=cells.length>1?drag.mid[1]-drag.mid[0]:0;
  drag.to=drag.from;
  drag.cell.classList.add("drag");
  cells.forEach(c=>{if(c!==drag.cell)c.classList.add("shift")});
  const cm=document.querySelector("#v-compare .cmp");if(cm)cm.classList.add("dragging");
  xsLead=xsBody();
  try{if(navigator.vibrate)navigator.vibrate(12)}catch(err){}
  dragPaint();
  const tick=()=>{if(!drag||!drag.on)return;dragEdge();drag.raf=requestAnimationFrame(tick)};
  drag.raf=requestAnimationFrame(tick);
}
/* near the left / right edge the table scrolls by itself so a model can be carried to any position */
function dragEdge(){
  const sc=drag.sc,b=xsBody();if(!sc||!b||Math.abs(drag.x-drag.x0)<12)return;
  const r=sc.getBoundingClientRect(),lab=sc.querySelector(".dlab"),lw=lab?lab.getBoundingClientRect().width:0;
  let v=0;
  if(drag.x<r.left+lw+28)v=-8;else if(drag.x>r.right-28)v=8;
  if(!v)return;
  const before=b.scrollLeft;b.scrollLeft=before+v;
  if(b.scrollLeft!==before){xsSync(b);dragPaint()}
}
function dragPaint(){
  const sc=drag.sc,ds=sc?sc.scrollLeft-drag.sl0:0;
  const dx=drag.x-drag.x0+ds,cx=drag.mid[drag.from]+dx;
  /* new position = how many of the other models sit left of the dragged one's centre */
  const to=drag.mid.reduce((k,m,j)=>j!==drag.from&&m<cx?k+1:k,0);
  drag.to=to;
  drag.cells.forEach((c,j)=>{
    if(c===drag.cell){c.style.transform=`translateX(${dx}px) scale(1.03)`;return}
    let s=0;if(drag.from<to&&j>drag.from&&j<=to)s=-drag.step;else if(to<drag.from&&j>=to&&j<drag.from)s=drag.step;
    c.style.transform=s?`translateX(${s}px)`:"";
  });
}
function dragMove(e){
  if(!drag||e.pointerId!==drag.pid)return;
  drag.x=e.clientX;
  if(!drag.on){
    const dx=e.clientX-drag.x0,dy=e.clientY-drag.y0;
    if(drag.type==="mouse"){if(Math.abs(dx)>6)dragOn();return}
    if(Math.hypot(dx,dy)>8){clearTimeout(drag.timer);drag=null}
    return;
  }
  dragPaint();
}
function dragEnd(e){
  if(!drag||(e&&e.pointerId!=null&&e.pointerId!==drag.pid))return;
  const d=drag;drag=null;clearTimeout(d.timer);cancelAnimationFrame(d.raf);
  if(!d.on)return;
  xsLead=null;
  const cat=cmpCat(),l=S.cmp[cat],i=l.indexOf(d.id);
  if(e&&e.type!=="pointercancel"&&i>=0&&d.to!==d.from){l.splice(i,1);l.splice(d.to,0,d.id);savePrefs()}
  dragJustEnded=Date.now();
  renderCompare();
}
let dragJustEnded=0;

/* one column per model version (RAM/ROM or size); columns ordered by number of "best" rows. More than 3 columns → top-3 badges, otherwise only the best is marked */
function mxCalc(c,items){
  const groups=[],o=opts(c,"price");
  for(const g of SPEC[c]){
    const gr=[];
    for(const r of g.rows){
      if(r[0]==="price_myr")continue;
      if(!rowOn(o,g,r[0]))continue;
      const vals=items.map(d=>val(d,r[0]));
      if(vals.every(v=>v==null||v===""))continue;
      if(o.diff){const sh=vals.map(v=>fmt(v,r[3]));if(sh.every(x=>x===sh[0]))continue}
      gr.push({r,vals,rk:ranks(r[4],vals)});
    }
    if(gr.length)groups.push({g,gr});
  }
  const adv=items.map(()=>0);
  groups.forEach(({gr})=>gr.forEach(({rk})=>{if(rk)rk.forEach((k,i)=>{if(k===1)adv[i]++})}));
  const order=items.map((d,i)=>i).sort((a,b)=>adv[b]-adv[a]||items[a].price_myr-items[b].price_myr);
  return{groups,adv,order};
}

    });
  });

  if(c==="watch"&&o.health)body+=listRows(T("health"),"health");
  if(o.feat)body+=listRows(T("features"),"features");
  if(o.ai)body+=listRows(T("ai"),"ai_features");
  const cols=`<colgroup><col class="lcw">${order.map(()=>"<col>").join("")}</colgroup>`;
  return`<section class="box"><div class="bh">${IC[c]}<b>${cn(c)}</b><span class="r">${T("n_models",span)}${span>2?` · ${T("swipe")}`:""}</span></div>

    <div class="mxw"><table class="mx" style="--n:${span}">${cols}<tbody>${body}</tbody></table></div></section>`;

/* split text into lines that fit maxW (Latin words stay whole, Chinese breaks between characters); the last kept line ends in … */

    t=t.trimStart();
    if(W(t.trimEnd())<=maxW){cur=t;continue}
    for(const ch of t){if(cur&&W(cur+ch)>maxW){L.push(cur);cur=ch}else cur+=ch}

        const cx=P+i*(cw+G),cy=y+30,col=CV.d[i%4];
        crr(x,cx,cy,cw,ch,18);x.fillStyle=CV.panel;x.fill();x.strokeStyle=CV.line;x.lineWidth=1;x.stroke();
        x.save();crr(x,cx,cy,cw,ch,18);x.clip();x.fillStyle=col;x.fillRect(cx,cy,cw,6);x.restore();
        cpic(x,pics[i],cx+ip,cy+18,cw-2*ip,ih-10);
        let ty=cy+6+ih+22;
        x.font=cfont(600,18);const bl=cwrap(x,(k.d.brand||"").toUpperCase(),cw-2*ip-20,1)[0];
        x.fillStyle=col;x.beginPath();x.arc(cx+ip+6,ty+10,6,0,Math.PI*2);x.fill();
        cls(x,1.5);ctx2(x,bl,cx+ip+20,ty,cfont(600,18),CV.muted);cls(x,0);ty+=28;
        k.nl.forEach(l=>{ctx2(x,l,cx+ip,ty,cfont(700,nf),CV.ink);ty+=nf*1.28});
        ty+=14;
        const pr=k.d.price_myr!=null?rm(k.d.price_myr):T("tbd");
        ctx2(x,pr,cx+ip,ty,cfont(700,pf,"m"),k.d.price_myr!=null?CV.accent:CV.muted);
        if(k.d.price_myr!=null){x.font=cfont(700,pf,"m");const pw=x.measureText(pr).width;if(pw+40<cw-2*ip)ctx2(x,T("from"),cx+ip+pw+8,ty+pf*.42,cfont(500,Math.round(pf*.55)),CV.muted)}
        ty+=pf*1.2;
        if(k.po.old||k.po.tag){let px=cx+ip;if(k.po.tag)px+=cpill(x,k.po.tag,px,ty+6,n<=2?18:15,CV.my,"#fff")+10;if(k.po.old){x.font=cfont(500,n<=2?20:17,"m");const ow=x.measureText(k.po.old).width;if(px+ow<=cx+cw-ip){ctx2(x,k.po.old,px,ty+9,cfont(500,n<=2?20:17,"m"),CV.faint);x.fillStyle=CV.faint;x.fillRect(px,ty+9+(n<=2?10:8.5),ow,2)}}ty+=40}
        ty+=14;
        cpill(x,T("leads",wins[i]),cx+ip,ty,n<=2?17:15,wins[i]?"rgba(61,220,151,.16)":"rgba(140,156,184,.12)",wins[i]?CV.win:CV.muted);
      });
    }});
  }
  /* spec rows */
  if(one){
    const lw=270,vx=P+lw+28,vw=W-P-20-vx;let odd=0;
    groups.forEach(g=>{
      if(!flat)B.push({h:74,draw(x,y){ctx2(x,g.g,P+4,y+34,cfont(700,23),CV.accent);x.fillStyle=CV.line2;x.fillRect(P,y+72,W-2*P,1)}});
      g.rows.forEach(r=>{
        x.font=cfont(500,26);const vl=cwrap(x,r.vals[0],vw,6);x.font=cfont(400,23);const ll=cwrap(x,r.label,lw-20,2);
        const h=Math.max(vl.length*26*1.38,ll.length*23*1.38)+34,stripe=odd++%2===0;
        B.push({h,draw(x,y){
          if(stripe){x.fillStyle="rgba(17,26,43,.75)";x.fillRect(P,y,W-2*P,h)}
          ll.forEach((l,i)=>ctx2(x,l,P+20,y+19+i*23*1.38,cfont(400,23),CV.muted));
          vl.forEach((l,i)=>ctx2(x,l,vx,y+17+i*26*1.38,cfont(500,26),CV.ink));
        }});
      });
    });
    extra.forEach(([t,l])=>{
      x.font=cfont(400,24);const tl=cwrap(x,l.join(S.lang==="en"?", ":"、"),W-2*P-40,12);
      B.push({h:74,draw(x,y){ctx2(x,t,P+4,y+34,cfont(700,23),CV.accent);x.fillStyle=CV.line2;x.fillRect(P,y+72,W-2*P,1)}});
      B.push({h:tl.length*24*1.5+36,draw(x,y){tl.forEach((s,i)=>ctx2(x,s,P+20,y+20+i*24*1.5,cfont(400,24),CV.ink))}});
    });
  }else{
    const G=16,cw=(W-2*P-(n-1)*G)/n,ip=n<=2?22:16,vf=n<=2?28:n===3?25:22;
    groups.forEach((g,gi)=>{
      if(!flat)B.push({h:74,draw(x,y){ctx2(x,g.g,P+4,y+34,cfont(700,23),CV.accent);x.fillStyle=CV.line2;x.fillRect(P,y+72,W-2*P,1)}});
      g.rows.forEach((r,ri)=>{
        x.font=cfont(600,vf);const lines=r.vals.map(v=>cwrap(x,v,cw-2*ip,3));
        const h=18+21*1.35+8+Math.max(...lines.map(l=>l.length))*vf*1.32+18,first=flat?gi===0&&ri===0:ri===0;
        B.push({h,draw(x,y){
          for(let i=0;i<n;i++){x.fillStyle="rgba(13,20,34,.85)";x.fillRect(P+i*(cw+G),y,cw,h)}
          if(!first){x.fillStyle=CV.line;x.fillRect(P,y,W-2*P,1)}
          ctx2(x,r.label,P+ip,y+18,cfont(500,21),CV.muted);
          lines.forEach((ls,i)=>{
            const cx=P+i*(cw+G)+ip,good=r.best[i];
            ls.forEach((l,j)=>ctx2(x,l,cx,y+18+21*1.35+8+j*vf*1.32,cfont(600,vf),r.vals[i]==="—"?CV.faint:good?CV.win:CV.ink));
            if(good){x.font=cfont(600,vf);const lw2=x.measureText(ls[0]).width;const px=Math.round(vf*.62);if(cx+lw2+10+px*2.2<=P+i*(cw+G)+cw-6)cpill(x,T("best"),cx+lw2+10,y+18+21*1.35+8+(vf-px*1.55)/2,px,"rgba(61,220,151,.18)",CV.win)}
          });
        }});
      });
    });
  }
  /* footer: price date and where to see the latest */
  B.push({h:156,draw(x,y){
    x.fillStyle=CV.line2;x.fillRect(P,y+36,W-2*P,1);
    ctx2(x,T("img_note",MY_TODAY),P,y+60,cfont(400,20),CV.muted);
    x.font=cfont(500,22);const ml=T("img_more");ctx2(x,ml,P,y+98,cfont(500,22),CV.ink);
    const mw=x.measureText(ml).width;ctx2(x,SITE.replace(/^https:\/\//,"").replace(/\/$/,""),P+mw+8,y+98,cfont(700,22,"m"),CV.accent);
    cradar(x,W-P-22,y+82,20);
    ctx2(x,T("img_daily"),W-P-56,y+72,cfont(500,18),CV.muted,"right");
  }});
  const H=Math.ceil(B.reduce((s,b)=>s+b.h,0));
  cv.height=H;x=cv.getContext("2d");x.textBaseline="top";x.imageSmoothingEnabled=true;x.imageSmoothingQuality="high";
  x.fillStyle=CV.bg;x.fillRect(0,0,W,H);
  let y=0;for(const b of B){b.draw(x,y);y+=b.h}
  return cv;
}

/* ---------- glue ---------- */
let toastT=null;
function toast(msg){const el=$("#toast");$("#toast-t").textContent=msg;el.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("show"),2000)}
const VIEWS=["news","devices","compare","price"];
function renderView(){
  for(const v of VIEWS){const el=$("#v-"+v);const show=S.view===v;if(el.hidden===show)el.hidden=!show}
  if(S.view==="news")renderNews();else if(S.view==="devices")renderDevices();else if(S.view==="compare")renderCompare();else renderPrice();
}
function render(){renderHeader();renderView()}
function scrollPos(){const se=document.scrollingElement||document.documentElement;return window.scrollY||window.pageYOffset||(se&&se.scrollTop)||(document.body&&document.body.scrollTop)||0}
function onTop(){const b=$("#totop");if(b)b.classList.toggle("show",scrollPos()>240)}
function toTop(){
  try{window.scrollTo({top:0,behavior:"smooth"})}catch(e){if(window.scrollTo)window.scrollTo(0,0)}
  const se=document.scrollingElement;if(se&&se.scrollTop&&se.scrollTo)try{se.scrollTo({top:0,behavior:"smooth"})}catch(e){se.scrollTop=0}
}
function setView(v){
  if(!VIEWS.includes(v))v="news";
  S.view=v;
  if(v==="compare"&&S.cat==="all")S.cat=cmpCat();
  render();
  if(window.scrollTo)try{window.scrollTo({top:0})}catch(e){}
  onTop();
}
function toggleCmp(id){
  const d=BYID.get(id);if(!d)return;
  const l=S.cmp[d.category];const i=l.indexOf(id);
  if(i>=0){l.splice(i,1);toast(T("t_removed",cn(d.category)))}
  else if(l.length>=MAX){toast(T("t_max"));return}
  else{l.push(id);toast(T("t_added",cn(d.category),l.length))}
  savePrefs();
  renderHeader();
  if(S.view==="devices")syncCards();else if(S.view==="compare")renderCompare();else if(S.view==="price")renderPriceRes();
  paintPop();
}
/* picture zoom: the product image shown large over everything; any tap or Esc closes it */
function openZoom(src){
  const lb=$("#lb"),im=$("#lb-img");if(!lb||!im)return;
  im.removeAttribute("style");
  im.onload=()=>{const w=im.naturalWidth||0;if(w)im.style.width=Math.min(w*2,window.innerWidth*.92)+"px"};
  im.src=src;lb.hidden=false;
  requestAnimationFrame(()=>requestAnimationFrame(()=>lb.classList.add("show")));
}
function closeZoom(){const lb=$("#lb");if(!lb||lb.hidden)return false;lb.classList.remove("show");setTimeout(()=>{if(!lb.classList.contains("show"))lb.hidden=true},200);return true}
document.addEventListener("click",e=>{
  if(Date.now()-dragJustEnded<350)return;
  const el=e.target.closest&&e.target.closest("[data-action]");if(!el)return;
  const a=el.dataset.action;
  switch(a){
    case"view":if(el.dataset.v===S.view)toTop();else location.hash=el.dataset.v;break;
    case"lang":if(el.dataset.l!==S.lang){S.lang=el.dataset.l;savePrefs();applyStatic();render();paintPop()}break;
    case"cat":S.cat=el.dataset.c;savePrefs();render();break;
    case"region":S.region=el.dataset.r;renderHeader();renderNews();break;
    case"cmp-diff":{const c=cmpCat();setOpts(c,{diff:!opts(c).diff});renderCompare();break}
    case"zoom":openZoom(el.dataset.src);break;
    case"lb-close":closeZoom();break;
    case"open":{const id=el.dataset.id;if(el.dataset.v!=null&&el.dataset.v!=="")S.vsel[id]=+el.dataset.v;else delete S.vsel[id];S.back=S.pop==="news"?{kind:"news",id:S.open}:null;openPop("device",id);break}
    case"news":S.back=null;openPop("news",el.dataset.id);break;
    case"pop-back":{const b=S.back;S.back=null;if(b)openPop(b.kind,b.id);break}
    case"variant":{const d=BYID.get(el.dataset.id);if(!d)break;const ni=+el.dataset.i;if(ni===vIndex(d))break;const a=curDev(d);S.vsel[d.id]=ni;const b=curDev(d);const keys=[];if(a.price_myr!==b.price_myr)keys.push("price_myr");if(a.launch_my!==b.launch_my)keys.push("launch_my");(SPEC[d.category]||[]).forEach(g=>g.rows.forEach(r=>{if(fmt(val(a,r[0]),r[3])!==fmt(val(b,r[0]),r[3]))keys.push(r[0])}));S.flash={id:d.id,keys};repaintDevice();S.flash=null;break}
    case"xlsx":exportXlsx();break;
    case"share":shOpen(shareCtx(el.dataset.k,el.dataset.id),"menu");break;
    case"longimg":shOpen(shareCtx(el.dataset.k,el.dataset.id),"img");break;
    case"sh-close":shClose();break;
    case"sh-menu":if(SH){SH.view="menu";shPaint()}break;
    case"sh-img":if(SH){SH.view="img";makeImg()}break;
    case"sh-mode":if(SH&&el.dataset.m!==SH.mode){SH.mode=el.dataset.m;makeImg()}break;
    case"sh-native":shNative();break;
    case"sh-copy":shCopy();break;
    case"sh-save":shSave();break;
    case"sh-ishare":shImgShare();break;
    case"close":closePop();break;
    case"top":toTop();break;
    case"toggle-cmp":toggleCmp(el.dataset.id);break;
    case"clear-cmp":S.cmp[cmpCat()]=[];savePrefs();render();break;
    case"go-cmp":{S.cat=el.dataset.c;savePrefs();const had=popHist;closePop(true);if(had){try{history.replaceState(null,"","#compare")}catch(e){}setView("compare")}else if(location.hash==="#compare")setView("compare");else location.hash="compare";break}
    case"picker":S.pq="";openPop("picker");break;
    case"opts":S.oscope="cmp";openPop("opts");break;
    case"popts":S.oscope="price";S.ocat=optCatDefault();openPop("opts");break;
    case"brands":openPop("brands");break;
    case"brand":{const b=el.dataset.b,i=S.brands.indexOf(b);if(i>=0)S.brands.splice(i,1);else S.brands.push(b);savePrefs();paintPop();renderDevices();break}
    case"brand-clear":S.brands=[];savePrefs();paintPop();renderDevices();break;
    case"opt-cat":S.ocat=el.dataset.c;repaintDevice();break;
    case"opt-group":{const sc=oscope(),c=ocat(),o=opts(c,sc),g=(SPEC[c]||[]).find(x=>x.g===el.dataset.g);if(!g)break;const keys=g.rows.map(r=>r[0]),off=new Set(o.off);if(gstate(o,g)==="on")off.add(g.g);else off.delete(g.g);setOpts(c,{off:[...off],hide:o.hide.filter(k=>!keys.includes(k))},sc);repaintDevice();optsApply();break}
    case"opt-row":{const sc=oscope(),c=ocat(),o=opts(c,sc),g=(SPEC[c]||[]).find(x=>x.g===el.dataset.g),k=el.dataset.k;if(!g)break;let hide=o.hide.slice();if(o.off.includes(g.g))hide=[...new Set([...hide,...g.rows.map(r=>r[0])])].filter(x=>x!==k);else{const i=hide.indexOf(k);if(i>=0)hide.splice(i,1);else hide.push(k)}setOpts(c,{off:o.off.filter(x=>x!==g.g),hide},sc);repaintDevice();optsApply();break}
    case"opt-feat":case"opt-ai":case"opt-health":case"opt-diff":case"opt-marks":{const sc=oscope(),c=ocat(),key=a.slice(4);setOpts(c,{[key]:!opts(c,sc)[key]},sc);repaintDevice();optsApply();break}
    case"opt-all":{const sc=oscope(),c=ocat();setOpts(c,{off:[],hide:[],feat:true,ai:true,health:true,diff:false,marks:true,card:null},sc);repaintDevice();optsApply();break}
    case"opt-core":{const sc=oscope(),c=ocat(),keep=new Set(KEYROWS[c]||[]),hide=[];(SPEC[c]||[]).forEach(g=>g.rows.forEach(r=>{if(r[0]!=="price_myr"&&!keep.has(r[0]))hide.push(r[0])}));setOpts(c,{off:[],hide,feat:false,ai:false,health:false},sc);repaintDevice();optsApply();break}
    case"opt-card":{const c=ocat(),o=opts(c,"price"),cur=o.card||(HEAD[c]||[]).map(x=>x[0]),k=el.dataset.k,i=cur.indexOf(k),n=cur.slice();if(i>=0)n.splice(i,1);else{if(n.length>=CARDMAX){toast(T("card_max",CARDMAX));break}n.push(k)}setOpts(c,{card:n},"price");repaintDevice();renderPriceRes();break}
    case"opt-card-reset":{setOpts(ocat(),{card:null},"price");repaintDevice();renderPriceRes();break}
    case"preset":{S.budget=Number(el.dataset.v);savePrefs();const bi=document.getElementById("budget");if(bi)bi.value=String(S.budget);renderPriceRes();break}
    case"under":S.under=!S.under;savePrefs();renderPriceRes();break;
    case"pview":{const v=el.dataset.v==="table"?"table":"list";if(v!==S.pview){S.pview=v;savePrefs();renderPriceRes()}break}
    case"pbrands":openPop("pbrands");break;
    case"mem":openPop("mem");break;
    case"mem-ram":case"mem-rom":{const k=el.dataset.action==="mem-ram"?"ram":"rom",v=Number(el.dataset.v),i=S.mem[k].indexOf(v);if(i>=0)S.mem[k].splice(i,1);else S.mem[k].push(v);savePrefs();paintPop();renderPriceRes();break}
    case"mem-clear":S.mem={ram:[],rom:[]};savePrefs();paintPop();renderPriceRes();break;
    case"pbrand":{const b=el.dataset.b,i=S.pbrands.indexOf(b);if(i>=0)S.pbrands.splice(i,1);else S.pbrands.push(b);savePrefs();paintPop();renderPriceRes();break}
    case"pbrand-clear":S.pbrands=[];savePrefs();paintPop();renderPriceRes();break;
  }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="q"){S.q=t.value;renderDevices()}
  else if(t.id==="pq"){S.pq=t.value;const l=document.getElementById("pk-list");if(l)l.innerHTML=pickListHTML()}
  else if(t.id==="budget"||t.id==="range"){const raw=String(t.value).replace(/[^\d]/g,"");if(raw!==""){const v=Number(raw);if(Number.isFinite(v)&&v>=0){if(t.id==="budget")S.budget=v;else S.range=v;savePrefs();renderPriceRes()}}}
});
/* budget / range: tapping the field selects the whole number, so typing replaces it without deleting first */
const isBud=t=>t&&(t.id==="budget"||t.id==="range");
function selAll(t){try{t.setSelectionRange(0,String(t.value).length)}catch(e){try{t.select()}catch(e2){}}}
document.addEventListener("focusin",e=>{const t=e.target;if(!isBud(t))return;t._sel=1;selAll(t);setTimeout(()=>{if(document.activeElement===t)selAll(t)},0)});
document.addEventListener("pointerup",e=>{const t=e.target;if(isBud(t)&&t._sel){t._sel=0;e.preventDefault();selAll(t);setTimeout(()=>selAll(t),0)}});
document.addEventListener("click",e=>{const t=e.target;if(isBud(t)&&t._sel){t._sel=0;selAll(t)}});
/* budget / range: a left-empty field shows the value in use again instead of staying blank */
document.addEventListener("focusout",e=>{const t=e.target;if(t&&(t.id==="budget"||t.id==="range")&&String(t.value).replace(/[^\d]/g,"")==="")t.value=String(t.id==="budget"?S.budget:S.range)});
document.addEventListener("change",e=>{if(e.target.id==="sort"){S.sort=e.target.value;savePrefs();renderDevices()}});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&closeZoom())return;
  if(e.key==="Escape"&&shClose())return;
  if(e.key==="Escape"&&S.pop){closePop();return}
  if((e.key==="Enter"||e.key===" ")&&e.target&&e.target.dataset&&e.target.dataset.pc){e.preventDefault();e.target.click();return}
  if((e.key==="Enter"||e.key===" ")&&e.target&&e.target.dataset&&e.target.dataset.card){e.preventDefault();openPop("device",e.target.dataset.card)}
  if((e.key==="Enter"||e.key===" ")&&e.target&&e.target.dataset&&e.target.dataset.action==="news"){e.preventDefault();S.back=null;openPop("news",e.target.dataset.id)}
});
window.addEventListener("hashchange",()=>route(location.hash.slice(1)));
let fitT=null;
window.addEventListener("resize",()=>{measure();moveInd();clearTimeout(fitT);fitT=setTimeout(()=>{if(S.view==="news")fitChips()},120)});
document.addEventListener("pointerdown",dragStart);
document.addEventListener("pointermove",dragMove,{passive:true});
document.addEventListener("pointerup",dragEnd);
document.addEventListener("pointercancel",dragEnd);
/* while a model is being dragged the page must not scroll under the finger */
document.addEventListener("touchmove",e=>{if(drag&&drag.on&&e.cancelable)e.preventDefault()},{passive:false});
document.addEventListener("contextmenu",e=>{if(drag&&e.target&&e.target.closest&&e.target.closest(".dcell"))e.preventDefault()});
window.addEventListener("scroll",onTop,{passive:true});
document.addEventListener("scroll",onTop,{passive:true,capture:true});
document.addEventListener("scroll",syncX,{passive:true,capture:true});
document.addEventListener("wheel",headWheel,{passive:false});
document.addEventListener("touchstart",headTouchStart,{passive:true});
document.addEventListener("touchmove",headTouchMove,{passive:true});
document.addEventListener("touchend",()=>{hdrTouch=null},{passive:true});

loadPrefs();
dlCap();
applyStatic();
route(location.hash.slice(1)||"news");
measure();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{measure();moveInd()});
})();
